<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="790" viewBox="0 0 1160 790" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="c1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="c2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="1160" height="790" fill="#ffffff"/>

  <!-- Cabeçalhos -->
  <rect x="52" y="26" width="156" height="42" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="130" y="52" text-anchor="middle" font-size="12.5" font-weight="bold">Usuário</text>
  <rect x="298" y="26" width="174" height="42" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="385" y="52" text-anchor="middle" font-size="12.5" font-weight="bold">Painel web</text>
  <rect x="600" y="26" width="190" height="42" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="695" y="52" text-anchor="middle" font-size="12.5" font-weight="bold">API de ocorrências</text>
  <rect x="902" y="26" width="176" height="42" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="990" y="52" text-anchor="middle" font-size="12.5" font-weight="bold">Banco de dados</text>

  <!-- Linhas de vida -->
  <g stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 5">
    <line x1="130" y1="68" x2="130" y2="712"/>
    <line x1="385" y1="68" x2="385" y2="712"/>
    <line x1="695" y1="68" x2="695" y2="712"/>
    <line x1="990" y1="68" x2="990" y2="712"/>
  </g>

  <!-- 1 -->
  <line x1="130" y1="104" x2="379" y2="104" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#c1)"/>
  <text x="254" y="96" text-anchor="middle" font-size="11.5">abre o painel no navegador</text>

  <!-- 2 -->
  <line x1="385" y1="140" x2="689" y2="140" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#c1)"/>
  <text x="537" y="132" text-anchor="middle" font-size="11.5">GET /naturezas  e  GET /delegacias</text>

  <!-- 3 -->
  <line x1="695" y1="172" x2="984" y2="172" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#c1)"/>
  <text x="840" y="164" text-anchor="middle" font-size="11.5">consulta as tabelas de referência</text>

  <!-- 4 -->
  <line x1="990" y1="202" x2="701" y2="202" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#c2)"/>
  <text x="845" y="194" text-anchor="middle" font-size="11.5" fill="#3d3d3d">tipos e unidades cadastradas</text>

  <!-- 5 -->
  <line x1="695" y1="232" x2="391" y2="232" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#c2)"/>
  <text x="543" y="224" text-anchor="middle" font-size="11.5" fill="#3d3d3d">JSON com as listas</text>

  <!-- 6 -->
  <line x1="385" y1="264" x2="136" y2="264" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#c2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="11.5" fill="#3d3d3d">exibe os filtros preenchidos</text>

  <!-- 7 -->
  <line x1="130" y1="308" x2="379" y2="308" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#c1)"/>
  <text x="254" y="300" text-anchor="middle" font-size="11.5">seleciona tipo, território e período</text>

  <!-- 8 -->
  <line x1="385" y1="344" x2="689" y2="344" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#c1)"/>
  <text x="537" y="336" text-anchor="middle" font-size="11.5">GET série histórica, ranking,</text>
  <text x="537" y="360" text-anchor="middle" font-size="11.5">distribuição regional e tendência</text>

  <!-- 9 -->
  <line x1="695" y1="392" x2="984" y2="392" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#c1)"/>
  <text x="840" y="384" text-anchor="middle" font-size="11.5">consultas agregadas por</text>
  <text x="840" y="408" text-anchor="middle" font-size="11.5">mês, delegacia e região</text>

  <!-- 10 -->
  <line x1="990" y1="436" x2="701" y2="436" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#c2)"/>
  <text x="845" y="428" text-anchor="middle" font-size="11.5" fill="#3d3d3d">totais do recorte</text>

  <!-- Frame alternativo -->
  <rect x="90" y="456" width="736" height="234" fill="none" stroke="#5c5c5c" stroke-width="1.2"/>
  <path d="M90,456 L188,456 L188,476 L176,484 L90,484 z" fill="#5c5c5c"/>
  <text x="100" y="471" font-size="11" font-weight="bold" fill="#ffffff">alternativa</text>
  <text x="200" y="472" font-size="11.5" fill="#3d3d3d">há registros no filtro selecionado</text>

  <line x1="695" y1="512" x2="391" y2="512" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#c2)"/>
  <text x="543" y="504" text-anchor="middle" font-size="11.5" fill="#3d3d3d">200 com séries e totais</text>
  <path d="M385,528 L440,528 L440,552 L391,552" fill="none" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#c1)"/>
  <text x="450" y="545" font-size="11.5">monta os gráficos e as tabelas</text>
  <line x1="385" y1="578" x2="136" y2="578" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#c2)"/>
  <text x="258" y="570" text-anchor="middle" font-size="11.5" fill="#3d3d3d">apresenta o recorte consultado</text>

  <!-- divisor da alternativa -->
  <line x1="90" y1="596" x2="826" y2="596" stroke="#5c5c5c" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="100" y="612" font-size="11.5" fill="#3d3d3d">nenhum registro usando filtro selecionado</text>
  <line x1="695" y1="634" x2="391" y2="634" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#c2)"/>
  <text x="543" y="626" text-anchor="middle" font-size="11.5" fill="#3d3d3d">200 com listas vazias</text>
  <line x1="385" y1="662" x2="136" y2="662" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#c2)"/>
  <text x="258" y="654" text-anchor="middle" font-size="11.5" fill="#3d3d3d">informa que não há registros no período</text>

  <line x1="52" y1="738" x2="1108" y2="738" stroke="#c4c4c4" stroke-width="1"/>
  <text x="52" y="758" font-size="11.5" fill="#3d3d3d">A ausência de registros é tratada como resultado válido e não como erro, de modo que a interface distingue um recorte vazio de uma falha de comunicação.</text>
</svg>
