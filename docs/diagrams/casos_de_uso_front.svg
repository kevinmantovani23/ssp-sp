<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ponta" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9" fill="none" stroke="#5c5c5c" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="1180" height="900" fill="#ffffff"/>

  <!-- ================= ATOR PRINCIPAL ================= -->
  <g stroke="#1a1a1a" stroke-width="1.8" fill="none">
    <circle cx="150" cy="392" r="17"/>
    <line x1="150" y1="409" x2="150" y2="462"/>
    <line x1="120" y1="428" x2="180" y2="428"/>
    <line x1="150" y1="462" x2="126" y2="500"/>
    <line x1="150" y1="462" x2="174" y2="500"/>
  </g>
  <text x="150" y="526" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Usuário</text>
  <text x="150" y="546" text-anchor="middle" font-size="11.5" fill="#5c5c5c">cidadão, pesquisador</text>
  <text x="150" y="563" text-anchor="middle" font-size="11.5" fill="#5c5c5c">ou jornalista de dados</text>

  <!-- ================= FRONTEIRA DO SISTEMA ================= -->
  <rect x="340" y="45" width="520" height="790" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="600" y="76" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">Painel web de ocorrências criminais</text>
  <line x1="340" y1="92" x2="860" y2="92" stroke="#c4c4c4" stroke-width="1"/>

  <!-- ================= CASOS DE USO ================= -->
  <!-- UC1 -->
  <ellipse cx="600" cy="140" rx="160" ry="33" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="600" y="145" text-anchor="middle" font-size="13" fill="#1a1a1a">Definir o filtro da consulta</text>
  <!-- UC2 -->
  <ellipse cx="600" cy="255" rx="160" ry="33" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="600" y="260" text-anchor="middle" font-size="13" fill="#1a1a1a">Visualizar a evolução mensal</text>
  <!-- UC3 -->
  <ellipse cx="600" cy="370" rx="160" ry="33" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="600" y="375" text-anchor="middle" font-size="13" fill="#1a1a1a">Consultar o ranking de delegacias</text>
  <!-- UC4 -->
  <ellipse cx="600" cy="485" rx="160" ry="33" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="600" y="490" text-anchor="middle" font-size="13" fill="#1a1a1a">Consultar a distribuição por região</text>
  <!-- UC5 -->
  <ellipse cx="600" cy="600" rx="160" ry="33" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="600" y="605" text-anchor="middle" font-size="13" fill="#1a1a1a">Consultar a tendência e a projeção</text>
  <!-- UC6 -->
  <ellipse cx="600" cy="705" rx="160" ry="31" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="600" y="710" text-anchor="middle" font-size="13" fill="#1a1a1a">Inspecionar a origem dos dados</text>
  <!-- UC7 -->
  <ellipse cx="600" cy="795" rx="160" ry="31" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="600" y="800" text-anchor="middle" font-size="13" fill="#1a1a1a">Verificar a cobertura da base</text>

  <!-- ================= ASSOCIAÇÕES DO USUÁRIO ================= -->
  <g stroke="#1a1a1a" stroke-width="1.3" fill="none">
    <line x1="186" y1="410" x2="455" y2="154"/>
    <line x1="188" y1="420" x2="450" y2="266"/>
    <line x1="190" y1="432" x2="445" y2="378"/>
    <line x1="190" y1="446" x2="445" y2="492"/>
    <line x1="188" y1="458" x2="450" y2="589"/>
    <line x1="186" y1="466" x2="452" y2="682"/>
    <line x1="182" y1="472" x2="455" y2="772"/>
  </g>

  <!-- ================= ATOR SECUNDÁRIO ================= -->
  <rect x="930" y="360" width="200" height="88" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="1030" y="386" text-anchor="middle" font-size="12" fill="#3d3d3d">&#171;sistema externo&#187;</text>
  <text x="1030" y="408" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">API de ocorrências</text>
  <text x="1030" y="429" text-anchor="middle" font-size="12" fill="#3d3d3d">desenvolvida neste trabalho</text>

  <g stroke="#1a1a1a" stroke-width="1.3" fill="none">
    <line x1="924" y1="380" x2="748" y2="168"/>
    <line x1="924" y1="390" x2="754" y2="276"/>
    <line x1="924" y1="400" x2="759" y2="378"/>
    <line x1="924" y1="418" x2="756" y2="498"/>
    <line x1="924" y1="428" x2="750" y2="612"/>
    <line x1="924" y1="440" x2="736" y2="778"/>
  </g>

  <!-- ================= RELAÇÕES INCLUDE ================= -->
  <g stroke="#5c5c5c" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#ponta)">
    <path d="M444,262 L424,262 L424,200 L470,159"/>
    <path d="M444,377 L408,377 L408,205 L500,166"/>
    <path d="M444,492 L392,492 L392,210 L530,170"/>
    <path d="M444,607 L376,607 L376,215 L556,172"/>
  </g>
  <rect x="352" y="232" width="70" height="17" fill="#ffffff"/>
  <text x="418" y="245" text-anchor="end" font-size="11.5" fill="#5c5c5c">&#171;include&#187;</text>

  <!-- Extend -->
  <line x1="600" y1="674" x2="600" y2="639" stroke="#5c5c5c" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ponta)"/>
  <text x="612" y="662" font-size="11.5" fill="#5c5c5c">&#171;extend&#187;</text>

  <!-- ================= LEGENDA ================= -->
  <line x1="60" y1="856" x2="1120" y2="856" stroke="#c4c4c4" stroke-width="1"/>
  <text x="60" y="876" font-size="11.5" fill="#3d3d3d">Linhas contínuas representam associações entre ator e caso de uso. As tracejadas com &#171;include&#187; indicam comportamento obrigatoriamente reutilizado e a tracejada com &#171;extend&#187;, comportamento opcional,</text>
  <text x="60" y="893" font-size="11.5" fill="#3d3d3d">acessível a partir de qualquer uma das consultas.</text>
</svg>
