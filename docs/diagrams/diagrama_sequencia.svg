<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="676" viewBox="0 0 1160 676" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="s4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="s4o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="1160" height="676" fill="#ffffff"/>

  <!-- Cabecalhos -->
  <rect x="30" y="30" width="150" height="40" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="105" y="55" text-anchor="middle" font-size="12" font-weight="bold">ImportacaoScheduler</text>
  <rect x="242" y="30" width="150" height="40" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="317" y="55" text-anchor="middle" font-size="12" font-weight="bold">ImportacaoService</text>
  <rect x="454" y="30" width="160" height="40" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="534" y="55" text-anchor="middle" font-size="12" font-weight="bold">OcorrenciaRepository</text>
  <rect x="676" y="30" width="150" height="40" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="751" y="55" text-anchor="middle" font-size="12" font-weight="bold">SSPClient</text>
  <rect x="928" y="30" width="180" height="40" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="1018" y="55" text-anchor="middle" font-size="12" font-weight="bold">Portal SSP-SP</text>

  <!-- Linhas de vida -->
  <line x1="105" y1="70" x2="105" y2="618" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="317" y1="70" x2="317" y2="618" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="534" y1="70" x2="534" y2="618" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="751" y1="70" x2="751" y2="618" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="1018" y1="70" x2="1018" y2="618" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- 1 -->
  <line x1="105" y1="110" x2="311" y2="110" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#s4)"/>
  <text x="208" y="102" text-anchor="middle" font-size="11.5">executar()  ·  diariamente às 03h</text>

  <!-- Loop delegacias -->
  <rect x="266" y="130" width="820" height="472" fill="none" stroke="#5c5c5c" stroke-width="1.2"/>
  <path d="M266,130 L370,130 L370,150 L358,158 L266,158 z" fill="#5c5c5c"/>
  <text x="276" y="145" font-size="11" font-weight="bold" fill="#ffffff">repetir</text>
  <text x="382" y="146" font-size="11.5" fill="#3d3d3d">para cada uma das delegacias cadastradas</text>

  <!-- 2 -->
  <line x1="317" y1="186" x2="528" y2="186" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#s4)"/>
  <text x="422" y="178" text-anchor="middle" font-size="11.5">buscarUltimaDataImportadaPorDelegacia()</text>
  <!-- 3 -->
  <line x1="534" y1="214" x2="323" y2="214" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#s4o)"/>
  <text x="428" y="206" text-anchor="middle" font-size="11.5" fill="#3d3d3d">último mês já registrado na base</text>

  <!-- nota -->
  <text x="330" y="244" font-size="11" fill="#5c5c5c">determina os meses pendentes a partir da última data registrada</text>

  <!-- 4 -->
  <line x1="317" y1="276" x2="745" y2="276" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#s4)"/>
  <text x="531" y="268" text-anchor="middle" font-size="11.5">buscarOcorrencias(mesesPendentes, idSSP)</text>

  <!-- 5 -->
  <line x1="751" y1="312" x2="1012" y2="312" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#s4)"/>
  <text x="881" y="304" text-anchor="middle" font-size="11.5">GET ExportarMensal(ano, idGrupo)</text>

  <!-- Frame de retentativa -->
  <rect x="712" y="330" width="374" height="104" fill="none" stroke="#5c5c5c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M712,330 L826,330 L826,350 L814,358 L712,358 z" fill="#5c5c5c"/>
  <text x="722" y="345" font-size="11" font-weight="bold" fill="#ffffff">alternativa</text>
  <text x="838" y="346" font-size="11.5" fill="#3d3d3d">limite de requisições atingido</text>

  <line x1="1018" y1="382" x2="757" y2="382" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#s4o)"/>
  <text x="888" y="374" text-anchor="middle" font-size="11.5" fill="#3d3d3d">HTTP 429  ·  Retry-After</text>
  <line x1="751" y1="414" x2="1012" y2="414" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#s4)"/>
  <text x="881" y="406" text-anchor="middle" font-size="11.5">nova tentativa após espera progressiva</text>

  <!-- 6 resposta ok -->
  <line x1="1018" y1="460" x2="757" y2="460" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#s4o)"/>
  <text x="888" y="452" text-anchor="middle" font-size="11.5" fill="#3d3d3d">HTTP 200  ·  planilha XLSX</text>

  <!-- self call POI -->
  <path d="M751,478 L806,478 L806,504 L757,504" fill="none" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#s4)"/>
  <text x="816" y="496" font-size="11.5">conversão das linhas em ocorrências (Apache POI)</text>

  <!-- retorno para service -->
  <line x1="751" y1="528" x2="323" y2="528" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#s4o)"/>
  <text x="537" y="520" text-anchor="middle" font-size="11.5" fill="#3d3d3d">lista de ocorrências do período</text>

  <!-- saveAll -->
  <line x1="317" y1="580" x2="528" y2="580" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#s4)"/>
  <text x="422" y="572" text-anchor="middle" font-size="11.5">saveAll(ocorrencias)</text>

  <line x1="30" y1="632" x2="1130" y2="618" stroke="#c4c4c4" stroke-width="1"/>
  <text x="30" y="652" font-size="11.5" fill="#3d3d3d">Falhas na importação de uma delegacia são registradas em log e não interrompem o processamento das demais.</text>
</svg>
